[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptbi-studio"
version = "1.0.0"
description = "Prompt-driven analytics, visualization, dashboard, and Tableau delivery studio"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "plotly>=5.24",
  "streamlit>=1.41",
  "openpyxl>=3.1",
  "pyarrow>=17",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
tableau = ["tableauhyperapi>=0.0.21400", "tableauserverclient>=0.35"]
static = ["kaleido>=0.2.1"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
promptbi = "promptbi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

